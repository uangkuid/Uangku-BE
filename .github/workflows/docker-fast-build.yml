name: Fast Docker Build (AMD64 Only)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Write .env file from secret
        run: echo "${{ secrets.ENV_DEV }}" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCRIO }}

      # Cache Composer dependencies
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            /tmp/.buildx-cache
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-buildx-
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-
            ${{ runner.os }}-composer-

      - name: Build and push AMD64 Docker image (fast)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/uangkuid/uangku-be:pr-${{ github.event.number }}
            ${{ env.REGISTRY_GHCR }}/uangkuid/uangku-be:dev
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          labels: |
            org.opencontainers.image.title=Uangku Backend (Development)
            org.opencontainers.image.description=Laravel-based backend API for Uangku application (AMD64 only for speed)
            org.opencontainers.image.source=https://github.com/uangkuid/Uangku-BE
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Fast Docker build completed!**\n\nImage available at: `ghcr.io/uangkuid/uangku-be:pr-${{ github.event.number }}`\n\n*This is an AMD64-only build for faster CI feedback.*'
            })
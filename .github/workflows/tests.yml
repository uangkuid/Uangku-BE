name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    name: PHP ${{ matrix.php-version }} Tests

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, dom, filter, gd, json, mbstring, openssl
        coverage: pcov

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Copy .env.example to .env
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Set testing environment variables
      run: |
        echo "MAIN_SECRET_KEY=test_secret_key_12345" >> .env
        echo "MAIN_SALT_KEY=test_salt_key_67890" >> .env
        echo "JWT_SECRET=test_jwt_secret_key_for_testing" >> .env

    - name: Run Unit Tests
      run: php artisan test --testsuite=Unit --parallel

    - name: Run Feature Tests
      run: php artisan test --testsuite=Feature --parallel

    - name: Generate Coverage Report
      if: matrix.php-version == '8.3'
      run: php artisan test --coverage-clover coverage.xml

    - name: Upload Coverage to Codecov
      if: matrix.php-version == '8.3'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

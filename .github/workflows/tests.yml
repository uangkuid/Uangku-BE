name: Run Tests

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 8.4 Tests

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, dom, filter, gd, json, openssl
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Copy .env.example to .env
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Create SQLite database
      run: touch database/database.sqlite

    - name: Run migrations
      run: php artisan migrate --force

    - name: Set testing environment variables
      run: |
        # Must be >= 32 chars: AppServiceProvider::assertMinimumPepperLength()
        # rejects a shorter-but-set value at boot. Keep in sync with the
        # values in phpunit.xml and run-tests.sh.
        echo "MAIN_SALT_KEY=test_salt_key_67890_extended_32ch" >> .env
        echo "MAIN_SYSTEM_KEY=test_system_key_12345_extended_32c" >> .env
        echo "MAIN_BLIND_INDEX_KEY=test_blind_index_key_abcde_ext32c" >> .env
        echo "JWT_SECRET=test_jwt_secret_key_for_testing_32chars" >> .env

    - name: Run Unit Tests
      run: php artisan test --testsuite=Unit

    - name: Run Feature Tests
      run: php artisan test --testsuite=Feature

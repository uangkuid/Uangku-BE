name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: false
        default: "latest"

env:
  DOCKERHUB_IMAGE: docker.io/oratakashi/uangku-be
  GHCR_IMAGE: ghcr.io/uangkuid/uangku-be

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    name: Unit Tests

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, dom, filter, gd, json, openssl
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Copy .env.example to .env
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Create SQLite database
      run: touch database/database.sqlite

    - name: Run migrations
      run: php artisan migrate --force

    - name: Set testing environment variables
      run: |
        echo "MAIN_SECRET_KEY=test_secret_key_12345" >> .env
        echo "MAIN_SALT_KEY=test_salt_key_67890" >> .env
        echo "JWT_SECRET=test_jwt_secret_key_for_testing_32chars" >> .env

    - name: Run Unit Tests
      run: php artisan test --testsuite=Unit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: armbian
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write .env file from secret
        run: echo "${{ secrets.ENV_DEV }}" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: oratakashi
          password: ${{ secrets.DOCKER }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCRIO }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.title=Uangku Backend
            org.opencontainers.image.description=Laravel-based backend API for Uangku application

      - name: Build and push by digest (Docker Hub)
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push by digest (GHCR)
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ghcr
          dockerhub_digest="${{ steps.build-dockerhub.outputs.digest }}"
          ghcr_digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "/tmp/digests/dockerhub/${dockerhub_digest#sha256:}"
          touch "/tmp/digests/ghcr/${ghcr_digest#sha256:}"

      - name: Upload Docker Hub digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-dockerhub-${{ matrix.runner }}
          path: /tmp/digests/dockerhub/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload GHCR digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-ghcr-${{ matrix.runner }}
          path: /tmp/digests/ghcr/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Hub digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/dockerhub
          pattern: digests-dockerhub-*
          merge-multiple: true

      - name: Download GHCR digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/ghcr
          pattern: digests-ghcr-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: oratakashi
          password: ${{ secrets.DOCKER }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCRIO }}

      - name: Get Docker tags
        id: get-tags
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push - use latest and tag name
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "DOCKERHUB_TAGS=-t ${{ env.DOCKERHUB_IMAGE }}:latest -t ${{ env.DOCKERHUB_IMAGE }}:${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "GHCR_TAGS=-t ${{ env.GHCR_IMAGE }}:latest -t ${{ env.GHCR_IMAGE }}:${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "PRIMARY_TAG=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Branch push (dev) - use dev tag with SHA
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "DOCKERHUB_TAGS=-t ${{ env.DOCKERHUB_IMAGE }}:dev -t ${{ env.DOCKERHUB_IMAGE }}:dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "GHCR_TAGS=-t ${{ env.GHCR_IMAGE }}:dev -t ${{ env.GHCR_IMAGE }}:dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "PRIMARY_TAG=dev" >> $GITHUB_OUTPUT
          else
            # Manual workflow dispatch
            DOCKER_TAG=${{ github.event.inputs.tag || 'latest' }}
            echo "DOCKERHUB_TAGS=-t ${{ env.DOCKERHUB_IMAGE }}:${DOCKER_TAG}" >> $GITHUB_OUTPUT
            echo "GHCR_TAGS=-t ${{ env.GHCR_IMAGE }}:${DOCKER_TAG}" >> $GITHUB_OUTPUT
            echo "PRIMARY_TAG=${DOCKER_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Create manifest list and push (Docker Hub)
        working-directory: /tmp/digests/dockerhub
        run: |
          docker buildx imagetools create ${{ steps.get-tags.outputs.DOCKERHUB_TAGS }} \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Create manifest list and push (GHCR)
        working-directory: /tmp/digests/ghcr
        run: |
          docker buildx imagetools create ${{ steps.get-tags.outputs.GHCR_TAGS }} \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Inspect Docker Hub image
        run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ steps.get-tags.outputs.PRIMARY_TAG }}

      - name: Inspect GHCR image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.get-tags.outputs.PRIMARY_TAG }}

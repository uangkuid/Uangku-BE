name: Build and Push Docker Image Multi-Architecture

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: false
        default: "latest"
      multi_arch:
        description: "Build multi-architecture image (ARM64 + AMD64)"
        required: false
        default: "false"
        type: boolean

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write .env file from secret
        run: echo "${{ secrets.ENV_DEV }}" > .env

      - name: Get Docker tags and platforms
        id: get-tags
        run: |
          DOCKER_TAG=${{ github.event.inputs.tag || 'latest' }}
          MULTI_ARCH=${{ github.event.inputs.multi_arch || 'false' }}
          
          # For main branch pushes, only build AMD64 for speed unless explicitly requested
          if [[ "${{ github.event_name }}" == "push" && "$MULTI_ARCH" != "true" ]]; then
            PLATFORMS="linux/amd64"
            echo "🚀 Building single architecture (AMD64) for faster CI"
          else
            PLATFORMS="linux/amd64,linux/arm64"
            echo "🏗️ Building multi-architecture (AMD64 + ARM64)"
          fi
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            DOCKER_TAG="latest"
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "DOCKER_TAGS<<EOF" >> $GITHUB_OUTPUT
            echo "${{ env.REGISTRY_DOCKER }}/oratakashi/uangku-be:latest" >> $GITHUB_OUTPUT
            echo "${{ env.REGISTRY_DOCKER }}/oratakashi/uangku-be:${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "${{ env.REGISTRY_GHCR }}/uangkuid/uangku-be:latest" >> $GITHUB_OUTPUT
            echo "${{ env.REGISTRY_GHCR }}/uangkuid/uangku-be:${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "DOCKER_TAGS<<EOF" >> $GITHUB_OUTPUT
            echo "${{ env.REGISTRY_DOCKER }}/oratakashi/uangku-be:${DOCKER_TAG}" >> $GITHUB_OUTPUT
            echo "${{ env.REGISTRY_GHCR }}/uangkuid/uangku-be:${DOCKER_TAG}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          
          echo "PLATFORMS=${PLATFORMS}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: contains(steps.get-tags.outputs.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: oratakashi
          password: ${{ secrets.DOCKER }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCRIO }}

      # Enhanced caching strategy
      - name: Cache Docker layers and Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            /tmp/.buildx-cache
            ~/.composer/cache
            /var/lib/docker/tmp
          key: ${{ runner.os }}-docker-${{ hashFiles('**/composer.lock', '**/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-${{ hashFiles('**/composer.lock', '**/Dockerfile') }}-
            ${{ runner.os }}-docker-${{ hashFiles('**/composer.lock') }}-
            ${{ runner.os }}-docker-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.get-tags.outputs.PLATFORMS }}
          push: true
          tags: ${{ steps.get-tags.outputs.DOCKER_TAGS }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=${{ env.REGISTRY_GHCR }}/uangkuid/uangku-be:cache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-new,mode=max
            type=registry,ref=${{ env.REGISTRY_GHCR }}/uangkuid/uangku-be:cache,mode=max
          labels: |
            org.opencontainers.image.title=Uangku Backend
            org.opencontainers.image.description=Laravel-based backend API for Uangku application
            org.opencontainers.image.source=https://github.com/uangkuid/Uangku-BE
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_started_at }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Move cache to avoid issues with Docker Buildx
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build Summary
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: ${{ steps.get-tags.outputs.PLATFORMS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: $(echo '${{ steps.get-tags.outputs.DOCKER_TAGS }}' | tr '\n' ', ')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.get-tags.outputs.PLATFORMS }}" == "linux/amd64" ]]; then
            echo "- **Performance**: ⚡ Fast build (AMD64 only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Performance**: 🏗️ Multi-architecture build" >> $GITHUB_STEP_SUMMARY
          fi

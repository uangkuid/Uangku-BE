services:
  api:
    container_name: api
    image: oratakashi/uangku-be:latest
    entrypoint: php artisan octane:frankenphp
    restart: unless-stopped
    ports:
      - "80:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - uangku-network

  mariadb:
    container_name: mariadb
    image: mariadb:latest
    restart: always
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_HOST: '%'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - /home/oratakashi/mysql:/var/lib/mysql
    networks:
      - uangku-network

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - /home/oratakashi/redis:/data
    networks:
      - uangku-network

  minio:
    container_name: minio
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - uangku-network
    volumes:
      - /home/oratakashi/minio:/bitnami/minio/data
    environment:
      - MINIO_ROOT_USER=${MINIO_USERNAME}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - MINIO_DEFAULT_BUCKETS=${AWS_BUCKET}
      - MINIO_ADDRESS=:9000
      - MINIO_CONSOLE_ADDRESS=:9001
    command: minio server /bitnami/minio/data

networks:
  uangku-network:
    driver: bridge

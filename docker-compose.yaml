version: "3.8"

services:
  api:
    container_name: api
    image: oratakashi/uangku-be:latest
    entrypoint: php artisan octane:frankenphp
    ports:
      - "80:8000"
    depends_on:
      - mariadb
      - redis
    networks:
      - uangku-network  # <-- Referensi network di bawah

  mariadb:
    container_name: mariadb
    image: mariadb:latest
    restart: always
    ports:
      - 3306:3306
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ~/mysql:/var/lib/mysql
    networks:
      - uangku-network

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass root
    volumes:
      - ~/redis:/data
    networks:
      - uangku-network

networks:
  uangku-network:  # <-- Ini bagian penting, jangan sampai typo
    driver: bridge
